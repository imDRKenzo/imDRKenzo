name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # Read repository data with the Metrics secret and publish with the workflow token.
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: imDRKenzo
          filename: github-metrics.svg
          base: ""
          config_timezone: Asia/Manila
          config_order: isocalendar, languages
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: half-year
          plugin_languages: "yes"
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_other: "yes"
