<svg viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technology counts across five featured projects and 750 completed internship hours">
  <style>
    :root { --bone: #171717; --muted: #4b4b4b; --dim: #555555; --rule: #777777; --accent: #262626; --ghost: #595959; --ink: #171717; --paper: #ffffff; --node-bg: #ffffff; --core-bg: #ffffff; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .g1{transform-origin:48px 0;animation-delay:.3s}.g2{transform-origin:48px 0;animation-delay:.45s}.g3{transform-origin:48px 0;animation-delay:.6s}
    .g4{transform-origin:48px 0;animation-delay:.75s}.g5{transform-origin:48px 0;animation-delay:.9s}.g6{transform-origin:48px 0;animation-delay:1.05s}
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { opacity: 0; animation: fade .4s ease forwards; }
    .d1{animation-delay:1.0s}.d2{animation-delay:1.3s}.d3{animation-delay:1.6s}.d4{animation-delay:1.9s}.d5{animation-delay:2.2s}.d6{animation-delay:2.5s}
    @keyframes fade { to { opacity: 1; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .n1{animation-delay:.5s}.n2{animation-delay:.7s}.n3{animation-delay:.9s}.n4{animation-delay:1.1s}
    .ping { animation: ping 2.2s ease-out infinite; transform-origin: 622px 96px; }
    @keyframes ping { 0%{transform:scale(.4);opacity:.9} 80%,100%{transform:scale(2.8);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .bar,.spark,.dot,.rise,.ping { animation: none; }
      .bar{transform:scaleX(1)} .spark{stroke-dashoffset:0} .dot,.rise{opacity:1} .ping{opacity:0}
    }
  </style>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">TELEMETRY — PROJECTS &amp; INTERNSHIPS</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 02</text>
  <line x1="360" y1="64" x2="360" y2="296" stroke="var(--rule)" opacity=".4"/>
  <line x1="688" y1="64" x2="688" y2="296" stroke="var(--rule)" opacity=".4"/>

  <!-- Technology counts are out of five featured projects. -->
  <text fill="var(--dim)" class="mono" x="48" y="78" font-size="10" letter-spacing="2.5">STACK · PROJECTS USING EACH</text>
  <g class="mono" font-size="11">
    <text fill="var(--bone)" x="48" y="108">TypeScript</text>       <rect class="bar g1" x="48" y="116" width="180" height="6" fill="var(--accent)"/><text fill="var(--muted)" x="238" y="123" font-size="10">4 / 5</text>
    <text fill="var(--bone)" x="48" y="146">Next.js</text>  <rect class="bar g2" x="48" y="154" width="180" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="238" y="161" font-size="10">4 / 5</text>
    <text fill="var(--bone)" x="48" y="184">NestJS</text>      <rect class="bar g3" x="48" y="192" width="180" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="238" y="199" font-size="10">4 / 5</text>
    <text fill="var(--bone)" x="48" y="222">SQL Server</text>  <rect class="bar g4" x="48" y="230" width="90" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="148" y="237" font-size="10">2 / 5</text>
    <text fill="var(--bone)" x="48" y="260">PostgreSQL</text>        <rect class="bar g5" x="48" y="268" width="90"  height="6" fill="var(--bone)"/><text fill="var(--muted)" x="148" y="275" font-size="10">2 / 5</text>
    <text fill="var(--bone)" x="48" y="298">Python</text> <rect class="bar g6" x="48" y="306" width="45"  height="6" fill="var(--bone)"/><text fill="var(--muted)" x="103" y="313" font-size="10">1 / 5</text>
  </g>

  <!-- Cumulative hours grouped by internship completion. -->
  <text fill="var(--dim)" class="mono" x="392" y="78" font-size="10" letter-spacing="2.5">INTERNSHIP HOURS · 2026</text>
  <g>
    <line x1="392" y1="252" x2="656" y2="252" stroke="var(--rule)"/>
    <polyline class="spark" points="395,248 516,177 622,96" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
    <circle class="dot d1" cx="395" cy="248" r="2.5" fill="var(--bone)"/>
    <circle class="dot d2" cx="516" cy="177" r="2.5" fill="var(--bone)"/>
    <circle class="ping" cx="622" cy="96" r="4" stroke="var(--accent)" fill="none"/>
    <circle class="dot d5" cx="622" cy="96" r="3" fill="var(--accent)"/>
    <text fill="var(--accent)" class="mono dot d2" x="524" y="167" font-size="10">350 h</text>
    <text fill="var(--accent)" class="mono dot d5" x="616" y="86" font-size="10" text-anchor="end">750 h</text>
    <text fill="var(--dim)" class="mono" x="392" y="272" font-size="9.5" letter-spacing="1.5">JAN</text>
    <text fill="var(--dim)" class="mono" x="524" y="272" font-size="9.5" letter-spacing="1.5">APR</text>
    <text fill="var(--dim)" class="mono" x="656" y="272" text-anchor="end" font-size="9.5" letter-spacing="1.5">MAY</text>
    <text fill="var(--muted)" class="mono dot d6" x="392" y="300" font-size="10" letter-spacing="1.5">NVSU MIS 350 h · DICT 400 h</text>
  </g>

  <!-- profile counters -->
  <g>
    <g class="rise n1"><text fill="var(--bone)" class="mono" x="720" y="118" font-size="44">05</text><text fill="var(--muted)" class="mono" x="814" y="112" font-size="10" letter-spacing="2.5">FEATURED PROJECTS</text></g>
    <g class="rise n2"><text fill="var(--bone)" class="mono" x="720" y="178" font-size="44">02</text><text fill="var(--muted)" class="mono" x="814" y="172" font-size="10" letter-spacing="2.5">PITD PROJECTS</text></g>
    <g class="rise n3"><text fill="var(--bone)" class="mono" x="720" y="238" font-size="44">02</text><text fill="var(--muted)" class="mono" x="814" y="232" font-size="10" letter-spacing="2.5">INTERNSHIPS</text></g>
    <g class="rise n4"><text fill="var(--accent)" class="mono" x="718" y="298" font-size="44">750</text><text fill="var(--muted)" class="mono" x="814" y="292" font-size="10" letter-spacing="2.5">INTERNSHIP HOURS</text></g>
  </g>
</svg>
