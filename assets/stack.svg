<svg viewBox="0 0 1000 238" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical stack including languages, frontend, backend, data, hardware, networking, and tools">
  <style>
    :root { --bone: #171717; --muted: #4b4b4b; --dim: #555555; --rule: #777777; --accent: #262626; --ghost: #595959; --ink: #171717; --paper: #ffffff; --node-bg: #ffffff; --core-bg: #ffffff; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.5s} .a6{animation-delay:.6s} .a7{animation-delay:.7s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <line x1="138" y1="8" x2="138" y2="230" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <text class="mono rise a1" x="48" y="32"  font-size="12" fill="var(--muted)" letter-spacing="2">LANGUAGES</text>
  <text class="mono rise a1" x="154" y="32"  font-size="15" fill="var(--bone)">TypeScript · JavaScript · Python · Java</text>

  <text class="mono rise a2" x="48" y="64"  font-size="12" fill="var(--muted)" letter-spacing="2">FRONTEND</text>
  <text class="mono rise a2" x="154" y="64"  font-size="15" fill="var(--bone)">Next.js · React · HTML · CSS · Tailwind CSS · TanStack Query</text>

  <text class="mono rise a3" x="48" y="96"  font-size="12" fill="var(--muted)" letter-spacing="2">BACKEND</text>
  <text class="mono rise a3" x="154" y="96"  font-size="15" fill="var(--bone)">NestJS · Node.js · REST APIs · Socket.IO · Zod</text>

  <text class="mono rise a4" x="48" y="128" font-size="12" fill="var(--muted)" letter-spacing="2">DATA</text>
  <text class="mono rise a4" x="154" y="128" font-size="15" fill="var(--bone)">Microsoft SQL Server · PostgreSQL · Prisma ORM</text>

  <text class="mono rise a5" x="48" y="160" font-size="12" fill="var(--muted)" letter-spacing="2">HARDWARE</text>
  <text class="mono rise a5" x="154" y="160" font-size="15" fill="var(--bone)">Raspberry Pi · Arduino · GPIO relay control</text>

  <text class="mono rise a6" x="48" y="192" font-size="12" fill="var(--muted)" letter-spacing="2">NETWORKS</text>
  <text class="mono rise a6" x="154" y="192" font-size="15" fill="var(--bone)">Wi-Fi access points · structured cabling · CCTV · Starlink</text>

  <text class="mono rise a7" x="48" y="224" font-size="12" fill="var(--muted)" letter-spacing="2">TOOLING</text>
  <text class="mono rise a7" x="154" y="224" font-size="15" fill="var(--bone)">Git · GitHub · VS Code · Vercel · Railway</text>
</svg>
